[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snakedone"
version = "0.0.1"
description = "Executable Python documents with recorded outputs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
snakedone = "snakedone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snakedone"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.14.*"
pytest = "*"
ruff = "*"
pyright = "*"
pandas = "*"

[tool.pixi.pypi-dependencies]
snakedone = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
format = "ruff format ."
lint = "ruff check ."
typecheck = "pyright"
check = { depends-on = ["test", "lint", "typecheck"] }
demo = "snakedone examples/demo.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = ".pixi/envs"
venv = "default"
