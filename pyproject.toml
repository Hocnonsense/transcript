[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snakedone"
version = "0.0.1"
description = "Executable Python documents with recorded outputs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
html = ["markdown-it-py>=3,<5", "pygments>=2.18,<3"]
datavzrd = ["markdown-it-py>=3,<5", "pygments>=2.18,<3", "PyYAML>=6,<7"]
vegalite = [
    "altair>=5,<7",
    "markdown-it-py>=3,<5",
    "pygments>=2.18,<3",
    "vl-convert-python>=1,<2",
    "PyYAML>=6,<7",
]

[project.scripts]
snakedone = "snakedone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snakedone"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.14.*"
pytest = "*"
ruff = "*"
pyright = "*"
pandas = "*"
polars = "*"
altair = "*"
datavzrd = "*"
matplotlib = "*"

[tool.pixi.pypi-dependencies]
snakedone = { path = ".", editable = true, extras = [
    "html",
    "datavzrd",
    "vegalite",
] }

[tool.pixi.tasks]
test = "pytest"
format = "ruff format ."
lint = "ruff check ."
typecheck = "pyright"
check = { depends-on = ["lint", "typecheck", "test"] }
demo = "snakedone examples/demo.py"
demo-serve = "python examples/serve.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportUnusedExpression = false
venvPath = ".pixi/envs"
venv = "default"
