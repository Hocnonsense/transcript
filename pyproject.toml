[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snakedone"
version = "0.0.1"
description = "Executable Python documents with recorded outputs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
html = ["markdown-it-py>=3,<5"]
datavzrd = ["markdown-it-py>=3,<5", "PyYAML>=6,<7"]
vegalite = [
    "altair>=5,<7",
    "markdown-it-py>=3,<5",
    "vl-convert-python>=1,<2",
    "PyYAML>=6,<7",
]
snakemake = ["snakemake>=9,<10"]

[project.scripts]
snakedone = "snakedone.cli:main"

[tool.hatch.build]
artifacts = ["src/snakedone/html/_assets/*.css", "src/snakedone/html/_assets/*.js"]

[tool.hatch.build.targets.wheel]
packages = ["src/snakedone"]
exclude = ["**/.gitignore"]

[tool.hatch.build.hooks.custom]
path = "tools/hatch_build.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.14.*"
packaging = ">=24.0,<26" # Match Snakemake's PyPI requirement in Pixi's Conda solve.
pytest = "*"
ruff = "*"
pyright = "*"
pandas = "*"
polars = "*"
altair = "*"
datavzrd = "*"
matplotlib = "*"
esbuild = "*"
hatchling = "*"

[tool.pixi.pypi-dependencies]
snakemake = ">=9.20"
snakedone = { path = ".", editable = true, extras = [
    "html",
    "datavzrd",
    "vegalite",
] }

[tool.pixi.tasks]
test = "pytest"
format = "ruff format ."
minify = "python tools/minify_assets.py"
build = "hatchling build"
lint = "ruff check ."
typecheck = "pyright"
check = { depends-on = ["lint", "typecheck", "test"] }
demo = { depends-on = ["minify"], cmd = "snakedone examples/demo.py --html" }
demo-serve = "python examples/serve.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportUnusedExpression = false
venvPath = ".pixi/envs"
venv = "default"
