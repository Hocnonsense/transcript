<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'sha256-dMNL0Y1TBNDJHX9SZNUrxUJOjH3mFix1OL/y105Nz1Q=' 'sha256-pWKWd5MRMMnMiV/BEu+gxdoX+5yP0cLB0goadco0aPg=' 'sha256-j0qboxAONj+H80Uat0Q7zManAV7A/GQX/COVqJSxrOA=' 'sha256-V1ly183Lo1Tq6TWukTXR/wpFXNOEybqt43BsVdBM0qM=' blob:; connect-src https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
  <title>demo</title>
   <style>
    :root { color-scheme: light dark; --unit: 1.25rem; --body-max: 860px;
        --side: 15rem; --side-rail: 2.25rem; }
body { margin: 0; font: 17px/1.65 system-ui, sans-serif; }
.page { max-width: 860px; margin: 3rem auto; padding: 0 1.25rem 0 3rem; }
/* The body and navigate share one centered grid. The navigate keeps the same
   top-right position at every width; only the body's reservation changes, so
   nothing jumps. Below the breakpoint it floats over the body instead. */
.page--navigate { display: grid; grid-template-columns: minmax(0, 1fr) auto;
                 gap: var(--unit); margin: 3rem auto;
                 padding: 0 var(--unit);
                 max-width: calc(var(--body-max) + var(--side) + 3 * var(--unit)); }
.page--navigate > main { grid-area: 1 / 1; max-width: var(--body-max); }
.page--navigate > .navigate { grid-area: 1 / 2; }
.navigate { position: sticky; top: 3rem; align-self: start; z-index: 20;
           width: var(--side); max-height: calc(100vh - 6rem);
           overflow-y: auto; box-sizing: border-box;
           padding-right: .75rem; border-right: 1px solid #8885;
           font-size: .9rem; transition: width .2s ease; }
.navigate-tabs { display: flex; gap: .25rem; margin-bottom: .5rem; }
.navigate-tab { display: flex; align-items: center; flex: 1; min-width: 0;
               border-bottom: 2px solid transparent; }
.navigate-tab[data-active="true"] { border-bottom-color: #3984c6; }
.navigate-tab-body { flex: 1; min-width: 0; padding: .15rem .25rem;
                    background: none; border: 0; cursor: pointer;
                    color: #888; font: inherit; text-align: left;
                    white-space: nowrap; overflow: hidden;
                    text-overflow: ellipsis; }
.navigate-tab[data-active="true"] .navigate-tab-body {
  color: inherit; font-weight: 600; }
.navigate-tab-toggle { flex: none; width: 1.4rem; height: 1.4rem; display: grid;
                      place-items: center; background: none; border: 0;
                      cursor: pointer; border-radius: .25rem;
                      font: 700 .9rem/1 ui-monospace, monospace; }
.navigate-tab-toggle[aria-pressed="true"] { color: #3984c6; }
.navigate-tab-toggle[aria-pressed="false"] { color: #888; }
.navigate-eye { display: grid; width: 1rem; height: 1rem; }
.navigate-eye svg { grid-area: 1 / 1; width: 100%; height: 100%; fill: none;
                    stroke: currentColor; stroke-width: 1.5;
                    stroke-linecap: round; stroke-linejoin: round; }
.navigate-tab-toggle[aria-pressed="true"] .navigate-eye-closed,
.navigate-tab-toggle[aria-pressed="false"] .navigate-eye-open { display: none; }
.navigate-tab-toggle:hover { background: #3984c622; }
.navigate-tab-body:focus-visible, .navigate-tab-toggle:focus-visible {
  outline: 2px solid #3984c6; outline-offset: 2px; }
/* Nothing open: a compact bordered box of vertical tabs, same at every width. */
.navigate[data-collapsed="true"] { top: 3rem; width: var(--side-rail);
                                  height: auto; max-height: calc(100vh - 6rem);
                                  padding: .4rem .2rem;
                                  border: 1px solid #8885; border-radius: .4rem;
                                  background: canvas; box-shadow: none; }
.navigate[data-collapsed="true"] .navigate-list { display: none; }
.navigate[data-collapsed="true"] .navigate-tabs { flex-direction: column; gap: .3rem;
                                                margin-bottom: 0; }
.navigate[data-collapsed="true"] .navigate-tab { flex: none; border-bottom: 0;
                                               border-left: 2px solid transparent; }
.navigate[data-collapsed="true"] .navigate-tab-toggle { display: none; }
.navigate[data-collapsed="true"] .navigate-tab-body { flex: none; padding: .4rem .1rem;
                                                    writing-mode: vertical-rl; }
.navigate ol { list-style: none; margin: 0; padding: 0; }
.navigate li { margin: .1rem 0; }
.navigate a { display: block; padding: .1rem .5rem; color: inherit;
             text-decoration: none; border-left: 2px solid transparent; }
.navigate a:hover { color: #3984c6; border-left-color: #3984c6; }
.navigate .toc-l1 a { font-weight: 600; }
.navigate .toc-l2 a { padding-left: 1.25rem; }
.navigate .toc-l3 a { padding-left: 2rem; }
.navigate .toc-l4 a, .navigate .toc-l5 a, .navigate .toc-l6 a { padding-left: 2.75rem; }
.navigate .toc-label a { padding-left: 1.25rem; }
.navigate .toc-label a::before { content: "◆ "; color: #888; font-size: .7em;
                                vertical-align: .15em; }
h1, h2, h3 { line-height: 1.25; }
a { color: #3984c6; }
code { font-family: ui-monospace, monospace; font-size: .9em; }
blockquote { margin-left: 0; padding-left: 1rem; border-left: 3px solid #8885; }
table { border-collapse: collapse; }
th, td { border: 1px solid #8885; padding: .35rem .7rem; }

/* bordered boxes */
.script-code, .doctest-code {
  border: 1px solid #8885; border-radius: .4rem;
}

/* scripts */
.script-block { position: relative; margin: 0; padding: 0; border: 0; }
.script-block[open] { display: flow-root; }
/* A collapsed block shows only its gutter toggle, so it must still reserve a
   row; otherwise its toggle overlaps the next block's toggle in the gutter. */
.script-block:not([open]) { min-height: var(--unit); }
.script-code { margin: 0 0 1.5rem; padding: 1rem; overflow-x: auto;
               line-height: 1.5; }
/* The toggle lives in the left gutter, whose width is the layout unit, so it
   never takes space from the body. */
.script-toggle { position: absolute; left: calc(-1 * var(--unit)); top: 0;
                 width: var(--unit); height: var(--unit); display: grid;
                 place-items: center; cursor: pointer; list-style: none;
                 color: #3984c6; border-radius: .25rem; line-height: 1;
                 font: 700 .6rem/1 ui-monospace, monospace; }
.script-toggle::-webkit-details-marker { display: none; }
.script-toggle:focus-visible { outline: 2px solid #3984c6; outline-offset: 2px; }
.script-toggle:hover, .script-block[open] > .script-toggle { background: #3984c622; }
.script-block[open] > .script-toggle {
  position: sticky; top: .5rem; left: auto; z-index: 1;
  margin-left: calc(-1 * var(--unit)); margin-bottom: calc(-1 * var(--unit));
}

/* docstring and code records */
.report-block { display: flow-root; }
/* The border width is mirrored in custom properties so the absolutely
   positioned toggle can cancel it; otherwise collapsing the box would shift
   the toggle by the removed border. */
.doctest-code { position: relative; margin: .3rem 0; overflow: hidden;
                border-left: 3px solid #3984c6;
                --box-border-left: 3px; --box-border-top: 1px;
                font: .9em/1.5 ui-monospace, monospace; }
.doctest-code[data-boxed] { overflow: visible; }
.doctest-code[data-boxed="false"] {
  margin: 0; border: 0; border-radius: 0;
  --box-border-left: 0px; --box-border-top: 0px;
  /* The code is hidden but the gutter toggle is not; keep a row for it so a
     report shorter than the toggle cannot spill into the next block. */
  min-height: calc(var(--unit) + .3rem);
}
.doctest-code[data-boxed="false"] > .doc-text { display: none; }
.output-box-toggle {
  position: absolute;
  left: calc(-1 * var(--unit) - var(--box-border-left));
  top: calc(.3rem - var(--box-border-top));
  width: var(--unit); height: var(--unit); cursor: pointer;
  color: #3984c6; border: 0; border-radius: .25rem;
  background: transparent; font: 700 .6rem/1 ui-monospace, monospace; }
.output-box-toggle:hover { background: #3984c622; }
.output-box-toggle:focus-visible { outline: 2px solid #3984c6; outline-offset: 2px; }
.doc-text { margin: 0; overflow-x: auto; font: inherit; }
.doc-code, .doc-out { display: block; padding: 0 1rem; font: inherit; }
.doc-code { min-width: fit-content; padding-top: .65rem;
            background: #f1f5f9; color: #172033; }
.doc-line { position: relative; display: block; padding-left: 4ch; }
.doc-line::before { position: absolute; left: 0; content: "... ";
                    user-select: none; -webkit-user-select: none; }
.doc-line:first-child::before { content: ">>> "; }
.doc-line.multiline-string::before { content: ""; }
.snd-render-error { margin: 1rem 0; padding: .75rem 1rem; border: 1px solid #b42318;
                    border-radius: .4rem; color: #b42318; background: #fff1f0; }
.doc-out { padding-bottom: .65rem; }
.doc-code + .doc-out { padding-top: .35rem; }
.doc-code:only-child { padding-bottom: .65rem; }
.doc-out:only-child { padding-top: .65rem; }

/* source view */
.report-block { position: relative; }
.snd-view-toggle { position: absolute; right: 0; top: 0; z-index: 1;
                   padding: .15rem .5rem; cursor: pointer;
                   color: #3984c6; background: canvas;
                   border: 1px solid #8885; border-radius: .25rem;
                   font: 600 .75rem/1.4 system-ui, sans-serif; }
.snd-view-toggle:hover { background: #3984c622; }
.snd-view-toggle:focus-visible { outline: 2px solid #3984c6; outline-offset: 2px; }
.snd-source { display: none; margin: .3rem 0; padding: .65rem 1rem;
              overflow-x: auto; border: 1px solid #8885; border-radius: .4rem;
              font: .9em/1.5 ui-monospace, monospace;
              background: #f1f5f9; color: #172033; }
.report-block[data-snd-view="source"] > :not(.snd-view-toggle):not(.snd-source) {
  display: none; }
.report-block[data-snd-view="source"] > .snd-source { display: block; }
.snd-line { display: block; white-space: pre; min-height: 1.5em; }
.snd-line[data-line]::before { content: attr(data-line); display: inline-block;
  width: 3.5ch; margin-right: 1ch; text-align: right;
  color: #888; user-select: none; -webkit-user-select: none; }
.snd-toolbar { position: fixed; right: var(--unit); bottom: var(--unit); z-index: 30;
  display: flex; gap: .4rem; }
.snd-toolbar button { padding: .3rem .7rem; cursor: pointer;
  color: canvastext; background: canvas; border: 1px solid #8885;
  border-radius: .25rem; box-shadow: 0 1px 4px #0003;
  font: 600 .8rem/1.4 system-ui, sans-serif; }
.snd-toolbar button:hover { background: #3984c622; }

/* img */
img { max-width: 100%; height: auto; }
main img { display: block; margin: .35rem auto; max-height: 50vh;
           object-fit: contain; cursor: zoom-in; }
main img.image-expanded { width: 100%; max-height: none; cursor: zoom-out; }
main img:focus-visible { outline: 2px solid #3984c6; outline-offset: 2px; }

@media (max-width: 920px) {
  /* Below the body's limit the navigate floats over the text instead of taking
     a column, so the body uses the full width and the navigate starts closed.
     Its top-right position is unchanged, so it does not jump. */
  .page--navigate { display: block; }
  .page--navigate > main { margin: 0 auto; }
  /* A collapsed box sits between the body and the right edge, so the body
     yields its width; an opened panel just floats over the body. */
  .page--navigate:has(.navigate[data-collapsed="true"]) > main {
    margin-left: 0;
    margin-right: calc(var(--side-rail) + var(--unit)); }
  .navigate { position: fixed; top: 3rem; right: var(--unit); left: auto;
             background: canvas; color: canvastext;
             border: 1px solid #8885; border-radius: .4rem;
             box-shadow: -2px 0 12px #0002; }
}
@media (prefers-color-scheme: dark) {
  .doc-code { background: #202b3b; color: #e5eaf1; }
}
@media print {
  .page { max-width: none; margin: 0; padding: 0; }
  .page--navigate { display: block; }
  .navigate { display: none; }
  .script-toggle { display: none !important; }
  .script-block:not([open]) { min-height: 0; }
  .snd-toolbar, .snd-view-toggle { display: none !important; }
  .report-block[data-snd-view="source"] > :not(.snd-view-toggle):not(.snd-source) {
    display: block; }
  .report-block[data-snd-view="source"] > .snd-source { display: none; }
}


/* portable bitmap snapshots */
.snakedone-bitmap { display: block; max-width: 100%; height: auto; margin: .5rem auto; }
.snakedone-bitmap[style] {
  width: min(100%, calc(50vh * var(--image-ratio)));
}

   </style>

  <script>document.querySelectorAll('main img').forEach(image => {
  image.tabIndex = 0;
  image.setAttribute('role', 'button');
  image.setAttribute('aria-pressed', 'false');
  image.title = 'Click to expand to text width';
  function toggleImage() {
    const expanded = image.classList.toggle('image-expanded');
    image.setAttribute('aria-pressed', String(expanded));
    image.title = expanded
      ? 'Click to restore preview' : 'Click to expand to text width';
  }
  image.addEventListener('click', toggleImage);
  image.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleImage();
    }
  });
});

document.querySelectorAll('.doctest-code[data-boxed]').forEach(block => {
  const toggle = block.querySelector(':scope > .output-box-toggle');
  if (!toggle) return;
  function setBoxed(boxed) {
    block.dataset.boxed = String(boxed);
    toggle.setAttribute('aria-expanded', String(boxed));
    toggle.title = boxed ? 'Hide code and frame' : 'Show code and frame';
  }
  toggle.addEventListener('click', () => setBoxed(block.dataset.boxed !== 'true'));
  setBoxed(block.dataset.boxed === 'true');
});
</script>
<script>(function () {
  function wire(navigate) {
    if (navigate.dataset.sndWired === 'true') return;
    navigate.dataset.sndWired = 'true';
    const tabs = Array.from(navigate.querySelectorAll('.navigate-tab'));
    const list = navigate.querySelector('.navigate-list');
    if (!list) return;
    const entries = Array.from(list.querySelectorAll('[data-snd-type]'));
    function enabled() {
      return (list.dataset.sndShow || '').split(/\s+/).filter(Boolean);
    }
    function setEnabled(names) {
      list.dataset.sndShow = names.join(' ');
      entries.forEach(entry => {
        entry.hidden = !names.includes(entry.dataset.sndType);
      });
      tabs.forEach(tab => {
        const on = names.includes(tab.dataset.sndType);
        tab.dataset.active = String(on);
        tab.querySelector('.navigate-tab-toggle')
          ?.setAttribute('aria-pressed', String(on));
      });
      navigate.dataset.collapsed = String(names.length === 0);
    }
    tabs.forEach(tab => {
      const type = tab.dataset.sndType;
      tab.querySelector('.navigate-tab-toggle')?.addEventListener('click', () => {
        const names = enabled();
        setEnabled(names.includes(type)
          ? names.filter(name => name !== type) : [...names, type]);
      });
      tab.querySelector('.navigate-tab-body')?.addEventListener('click', () => {
        setEnabled([type]);
      });
    });
    if (!tabs.length) return;
    const narrow = window.matchMedia('(max-width: 920px)');
    const firstType = tabs[0].dataset.sndType;
    function sync(event) {
      setEnabled(event.matches ? [] : [firstType]);
    }
    sync(narrow);
    narrow.addEventListener('change', sync);
    document.addEventListener('click', event => {
      if (narrow.matches && !navigate.contains(event.target)) setEnabled([]);
    });
  }

  function initialize() {
    document.querySelectorAll('.navigate').forEach(wire);
  }

  window.snakedoneInitNavigate = initialize;
  initialize();
})();

<script>(function () {
  const island = document.getElementById('snakedone-source');
  if (!island) return;
  let source;
  try { source = JSON.parse(island.textContent); } catch (error) { return; }
  if (typeof source !== 'string') return;

  function setView(block, toggle, showSource) {
    block.dataset.sndView = showSource ? 'source' : 'rendered';
    toggle.textContent = showSource ? 'Rendered' : 'Source';
    toggle.setAttribute('aria-pressed', String(showSource));
  }

  document.querySelectorAll('.report-block[data-snd-start]').forEach(block => {
    const start = Number(block.dataset.sndStart);
    const end = Number(block.dataset.sndEnd);
    const first = Number(block.dataset.sndLine);
    const textLines = source.slice(start, end).split('\n');
    const pre = document.createElement('pre');
    pre.className = 'snd-source';
    textLines.forEach((text, index) => {
      const line = document.createElement('span');
      line.className = 'snd-line';
      line.dataset.line = String(first + index);
      line.textContent = text;
      pre.appendChild(line);
    });
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'snd-view-toggle';
    toggle.textContent = 'Source';
    toggle.setAttribute('aria-pressed', 'false');
    toggle.addEventListener('click', () =>
      setView(block, toggle, block.dataset.sndView !== 'source'));
    block.appendChild(toggle);
    block.appendChild(pre);
  });

  function download(name, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  const toolbar = document.createElement('div');
  toolbar.className = 'snd-toolbar';
  const sndButton = document.createElement('button');
  sndButton.type = 'button';
  sndButton.textContent = 'Export .snd';
  sndButton.addEventListener('click', () =>
    download(document.title + '.snd', source, 'text/plain'));
  toolbar.appendChild(sndButton);
  document.body.appendChild(toolbar);
})();
</script>

  }

  function install(resource, text) {
    // A stylesheet is inlined; a script runs from a blob URL, which keeps the
    // CSP at `blob:` instead of allowing each CDN host to run code directly.
    if (resource.type === 'style') {
      const style = document.createElement('style');
      style.dataset.sndLibrary = resource.name;
      style.textContent = text;
      document.head.appendChild(style);
      return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
      const blob = new Blob([text], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      const script = document.createElement('script');
      script.src = url;
      script.dataset.sndLibrary = resource.name;
      script.onload = () => { URL.revokeObjectURL(url); resolve(); };
      script.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error(`could not execute ${resource.name}`));
      };
      document.head.appendChild(script);
    });
  }

  function dedent(text) {
    // Reproduce `textwrap.dedent(...).strip()`: remove the longest common
    // leading whitespace, normalise whitespace-only lines, then trim.
    const lines = text.split('\n');
    const indents = lines
      .filter(line => /\S/.test(line))
      .map(line => (line.match(/^[ \t]*/) || [''])[0]);
    let prefix = indents.shift() || '';
    for (const indent of indents) {
      let size = 0;
      while (size < prefix.length && prefix[size] === indent[size]) size += 1;
      prefix = prefix.slice(0, size);
    }
    return lines.map(line => line.trim() ? line.slice(prefix.length) : '').join('\n').trim();
  }

  function markdownLiteral(raw) {
    // Extract the prose from a Markdown string literal. Prefixes (r/u) are
    // ignored and only the delimiter escapes `\\`, `\'`, `\"` are decoded;
    // every other backslash stays literal (design §6). CommonMark then applies
    // its own punctuation escapes to the result.
    const match = raw.match(/^[rRuU]*("""|'''|"|')/);
    if (!match) throw new Error('invalid markdown string literal');
    const delimiter = match[1];
    const end = raw.endsWith(delimiter) ? raw.length - delimiter.length : raw.length;
    const body = raw.slice(match[0].length, end);
    let decoded = '';
    for (let index = 0; index < body.length; index += 1) {
      const char = body[index];
      const next = body[index + 1];
      if (char === '\\' && (next === '\\' || next === '"' || next === "'")) {
        decoded += next;
        index += 1;
      } else {
        decoded += char;
      }
    }
    return dedent(decoded);
  }

  function lineRanges(text) {
    // Decode `data-snd-string-lines` (e.g. "1,4-5") into a set of 1-based lines.
    const result = new Set();
    for (const part of (text || '').split(',')) {
      if (!part) continue;
      const [first, last = first] = part.split('-').map(Number);
      for (let line = first; line <= last; line += 1) result.add(line);
    }
    return result;
  }

  function codeLines(node) {
    // Rebuild one physical statement from the island. Shared indentation is
    // stripped before highlighting, except on continuation lines of a multiline
    // string, which keep their indentation and drop the `>>>` prompt. The
    // server precomputes which lines those are (`data-snd-string-lines`).
    const start = Number(node.dataset.sndStart);
    const end = Number(node.dataset.sndEnd);
    const raw = source.slice(start, end);
    const lines = raw.split('\n');
    const indent = (lines.find(line => line.trim()) || '').match(/^[ \t]*/)[0];
    const interior = lineRanges(node.dataset.sndStringLines);
    return lines.map((line, index) => ({
      interior: interior.has(index + 1),
      text: interior.has(index + 1) ? line : line.startsWith(indent)
        ? line.slice(indent.length) : line
    }));
  }

  function renderCode(node) {
    const lines = codeLines(node);
    node.replaceChildren(...lines.map(lineData => {
      const line = document.createElement('span');
      line.className = 'doc-line' + (lineData.interior ? ' multiline-string' : '');
      if (lineData.interior) {
        // Interior lines are string content, but highlight.js cannot see the
        // opening delimiter on an earlier line, so mark them as strings here.
        const string = document.createElement('span');
        string.className = 'hljs-string';
        string.textContent = lineData.text;
        line.appendChild(string);
      } else {
        line.innerHTML = window.hljs.highlight(
          lineData.text, { language: 'python' }
        ).value;
      }
      return line;
    }));
  }

  function scriptSource(node) {
    // Semicolons between adjacent document expressions are only separators, so
    // a region that holds nothing else is dropped instead of showing an empty
    // toggle.
    const start = Number(node.dataset.sndStart);
    const end = Number(node.dataset.sndEnd);
    return source.slice(start, end).replace(/^[\r\n]+|[\r\n]+$/g, '');
  }

  function renderScript(node) {
    const code = scriptSource(node);
    if (!code.replace(/[ \t\r\n\f;]/g, '')) {
      node.remove();
      return;
    }
    const summary = document.createElement('summary');
    summary.className = 'script-toggle';
    summary.title = 'Show or hide script';
    summary.setAttribute('aria-label', 'Toggle script block');
    summary.innerHTML = '<span aria-hidden="true">&lt;/&gt;</span>';
    const pre = document.createElement('pre');
    pre.className = 'script-code';
    const child = document.createElement('code');
    child.className = 'language-python';
    child.innerHTML = window.hljs.highlight(code, { language: 'python' }).value;
    pre.appendChild(child);
    node.replaceChildren(summary, pre);
  }

  function externalLinks(root) {
    // Open online links in a new tab without leaking the referrer; this is the
    // browser counterpart of the removed server-side `external_links`.
    root.querySelectorAll('a[href]').forEach(link => {
      try {
        const url = new URL(link.getAttribute('href'), document.baseURI);
        if (url.protocol === 'http:' || url.protocol === 'https:') {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        }
      } catch (error) { /* markdown-it already sanitized the attribute */ }
    });
  }

  function renderMarkdown(node, markdown) {
    // Render with the same settings the server used before: CommonMark, no raw
    // HTML, tables enabled.
    const start = Number(node.dataset.sndMdStart);
    const end = Number(node.dataset.sndMdEnd);
    node.innerHTML = markdown.render(markdownLiteral(source.slice(start, end)));
    externalLinks(node);
  }

  function slug(text) {
    // Mirror `html/_navigate.py::_slug`: keep unicode letters/digits, collapse
    // whitespace and hyphens, and trim. `toLowerCase` (not the locale-aware
    // variant) matches Python's `str.lower`.
    return text.toLowerCase()
      .replace(/[^\p{L}\p{N}_\- ]+/gu, '')
      .replace(/[\s\-]+/g, '-')
      .replace(/^-|-$/g, '');
  }

  function outline() {
    // Rebuild the document outline from the rendered DOM. Slugs, dedup order,
    // and label levels mirror `html/_navigate.py` so the runtime outline matches
    // the server-rendered fallback: labels reserve their ids first, duplicate
    // slugs are numbered from `-1`, and a label takes the level of the heading
    // it follows (capped at 6).
    const main = document.querySelector('main');
    if (!main) return;
    const labels = Array.from(main.querySelectorAll('figure.snakedone-label[id]'));
    const seen = new Map(labels.map(label => [label.id, 0]));
    const entries = [];
    let level = 0;
    main.querySelectorAll('h1,h2,h3,h4,h5,h6,figure.snakedone-label[id]')
      .forEach(node => {
        if (node.matches('figure.snakedone-label')) {
          const caption = node.querySelector(':scope > figcaption')?.textContent?.trim();
          entries.push({ type: 'labels', level: Math.min(level + 1, 6),
            text: caption || node.id, id: node.id });
          return;
        }
        level = Number(node.tagName.slice(1));
        const text = node.textContent.trim();
        let id = node.id || slug(text) || `section-${entries.length}`;
        if (seen.has(id)) {
          const base = id;
          let count = seen.get(base);
          do { count += 1; id = `${base}-${count}`; } while (seen.has(id));
          seen.set(base, count);
        }
        seen.set(id, 0);
        node.id = id;
        entries.push({ type: 'contents', level, text, id });
      });
    const page = main.parentElement;
    page.querySelector(':scope > .navigate')?.remove();
    if (!entries.length) {
      page.className = 'page';
      return;
    }
    const types = ['contents', 'labels'].filter(type =>
      entries.some(entry => entry.type === type));
    const shown = types[0];
    const nav = document.createElement('nav');
    nav.className = 'navigate';
    nav.setAttribute('aria-label', 'Document outline');
    nav.dataset.collapsed = 'false';
    const tabs = document.createElement('div');
    tabs.className = 'navigate-tabs';
    const titles = { contents: 'Contents', labels: 'Labels' };
    for (const type of types) {
      const tab = document.createElement('div');
      tab.className = 'navigate-tab';
      tab.dataset.sndType = type;
      tab.dataset.active = String(type === shown);
      tab.innerHTML =
        `<button class="navigate-tab-body" type="button">${titles[type]}</button>` +
        `<button class="navigate-tab-toggle" type="button" aria-pressed="${type === shown}" ` +
        `aria-label="Add or remove ${titles[type]}"><span aria-hidden="true">◉</span></button>`;
      tabs.appendChild(tab);
    }
    const list = document.createElement('ol');
    list.className = 'navigate-list';
    list.dataset.sndShow = shown;
    for (const entry of entries) {
      const item = document.createElement('li');
      item.className = entry.type === 'contents'
        ? `toc-heading toc-l${entry.level}` : 'toc-label';
      item.dataset.sndType = entry.type;
      item.hidden = entry.type !== shown;
      const link = document.createElement('a');
      link.href = `#${entry.id}`;
      link.textContent = entry.text;
      item.appendChild(link);
      list.appendChild(item);
    }
    nav.append(tabs, list);
    page.className = 'page page--navigate';
    page.insertBefore(nav, main);
    window.snakedoneInitNavigate?.();
  }

  function showError(error) {
    const message = document.createElement('div');
    message.className = 'snd-render-error';
    message.setAttribute('role', 'alert');
    message.textContent = `Could not load browser renderers: ${error.message}`;
    document.querySelector('main')?.prepend(message);
  }

  async function render() {
    // Load the libraries first, then fill the placeholders. The outline runs
    // last so it sees every heading the Markdown pass produced.
    try {
      for (const resource of config.resources) {
        if (resource.global && window[resource.global]) continue;
        await install(resource, await download(resource));
      }
      if (typeof window.markdownit !== 'function' || !window.hljs) {
        throw new Error('renderer libraries did not expose their browser globals');
      }
      const markdown = window.markdownit('commonmark', { html: false }).enable('table');
      document.querySelectorAll('.doc-md[data-snd-md-start]').forEach(node =>
        renderMarkdown(node, markdown));
      document.querySelectorAll('.doc-code[data-snd-start]').forEach(renderCode);
      document.querySelectorAll('.script-block[data-snd-start]').forEach(renderScript);
      outline();
      document.documentElement.dataset.sndRendered = 'true';
      document.dispatchEvent(new CustomEvent('snakedone-rendered'));
    } catch (error) {
      showError(error instanceof Error ? error : new Error(String(error)));
    }
  }

  render();
})();
</script>
 </body>
</html>
