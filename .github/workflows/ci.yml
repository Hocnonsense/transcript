name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Steps in one job share the same working tree, PATH and Pixi
      # environment, so the environment is installed only once.
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Build frontend
        run: pixi run frontend-build

      - name: Check formatting
        run: pixi run ruff format --check .

      - name: Lint
        run: pixi run lint

      - name: Typecheck
        run: pixi run typecheck

      - name: Typecheck frontend
        run: pixi run frontend-typecheck

      - name: Run Python and frontend tests concurrently
        run: |
          status=0
          pixi run pytest & python_pid=$!
          pixi run frontend-test & frontend_pid=$!
          wait "$python_pid" || status=1
          wait "$frontend_pid" || status=1
          exit "$status"

      - name: Build sdist and wheel
        run: pixi run build
